<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<title>Smart Hospital Queue Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

/* 🔥 UPDATED LOADER */
#loader{
position:fixed;
width:100%;
height:100%;
background:#0f2027;
display:flex;
justify-content:center;
align-items:center;
z-index:2000;
flex-direction:column;
transition:opacity 0.6s ease;
}

.loader-box{
text-align:center;
color:white;
animation:fadeZoom 1.5s ease-in-out infinite alternate;
}

.loader-box img{
width:120px;
height:120px;
object-fit:cover;
border-radius:50%;
margin-bottom:15px;
box-shadow:0 0 25px rgba(34,197,94,0.5);
}

@keyframes fadeZoom{
0%{transform:scale(0.9); opacity:0.7;}
100%{transform:scale(1.1); opacity:1;}
}

/* 🔥 ANIMATED BACKGROUND */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
background:url("https://img.magnific.com/premium-photo/hospital-background-website-ai-generative_895799-9209.jpg") center/cover no-repeat;
}

.bg::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:linear-gradient(120deg,#0f2027,#203a43,#2c5364,#1c92d2,#0f2027);
background-size:400% 400%;
opacity:0.6;
animation:gradientMove 12s ease infinite;
}

.bg::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15), transparent 40%),
           radial-gradient(circle at 80% 70%, rgba(0,255,200,0.15), transparent 40%);
animation:floatLight 10s ease-in-out infinite alternate;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

@keyframes floatLight{
0%{transform:translateY(0px);}
100%{transform:translateY(-30px);}
}

/* LOGIN */
#login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:20px;
width:320px;
backdrop-filter:blur(15px);
text-align:center;
}

/* NAVBAR */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
height:70px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
position:sticky;
top:0;
z-index:1000;
}

/* CONTAINER */
.container{
width:95%;
max-width:1100px;
margin:auto;
}

/* HERO */
.hero{
height:160px;
margin-top:10px;
border-radius:15px;
overflow:hidden;
position:relative;
}

.hero h2{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
margin-top:15px;
}

.box{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:15px;
text-align:center;
}

.box i{
display:block;
font-size:22px;
margin-bottom:8px;
color:#4ade80;
}

/* PANEL */
.panel{
background:rgba(255,255,255,0.1);
padding:15px;
border-radius:15px;
margin-top:15px;
}

/* INPUT */
input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.1);
color:white;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#22c55e;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* ITEM */
.item{
display:flex;
justify-content:space-between;
padding:10px;
margin-top:10px;
border-radius:10px;
background:rgba(255,255,255,0.08);
}

.current{border:2px solid #22c55e;}
.emergency{border-left:5px solid red;}
.done{background:rgba(34,197,94,0.2);}

#timer{
margin-top:10px;
font-weight:bold;
color:#facc15;
}

/* FOOTER */
.footer{
text-align:center;
padding:15px;
margin-top:20px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
font-size:14px;
color:#ccc;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-box">
    <img src="https://i.pinimg.com/originals/bc/82/8c/bc828c792bbf40db3377d1b2e124fbde.png">
    <h2><i class="fa-solid fa-hospital"></i> TSK Smart Queue</h2>
    <p>Loading System...</p>
  </div>
</div>

<div class="bg"></div>

<!-- LOGIN -->
<div id="login">
<div class="card">
<h2><i class="fa-solid fa-user-lock"></i> TSK Login</h2>
<input id="user" placeholder="Enter Name">
<button onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Enter</button>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<div class="nav">
<h3 style="color: aliceblue;font-family: cursive;"><i class="fa-solid fa-hospital"></i> Smart Queue</h3>
<span id="userDisplay" style="color: aliceblue; font-family: cursive;"></span>
</div>

<div class="container">

<div class="hero">
<h2 style="font-family: cursive;"><i class="fa-solid fa-user-doctor"></i> Patient Queue System</h2>
</div>

<div class="grid">
<div class="box"><i class="fa-solid fa-ticket"></i><span id="current">-</span><br>Current</div>
<div class="box"><i class="fa-solid fa-clock"></i><span id="waiting">0</span><br>Waiting</div>
<div class="box"><i class="fa-solid fa-check-circle"></i><span id="served">0</span><br>Served</div>
<div class="box"><i class="fa-solid fa-hourglass-half"></i><span id="time">0</span><br>ETA</div>
</div>

<div class="panel">
<input id="name" placeholder="Patient Name">

<select style="color: #0f2027;" id="priority">
<option value="normal">Normal</option>
<option value="emergency">Emergency</option>
</select>

<select style="color: #0f2027;" id="dept">
<option>OPD 1</option>
<option>OPD 2</option>
<option>OPD 3</option>
</select>

<button onclick="add()"><i class="fa-solid fa-plus"></i> Generate Token</button>
<button onclick="sendToDoctor()"><i class="fa-solid fa-user-doctor"></i> Send to Doctor</button>
<button onclick="completeConsultation()"><i class="fa-solid fa-check"></i> Finish Consultation</button>
</div>

<div class="panel">
<input id="search" placeholder="Search..." onkeyup="render()">
</div>

<div class="panel">
<h3><i class="fa-solid fa-list"></i> Active Queue</h3>
<div id="list"></div>
</div>

<div class="panel">
<h3><i class="fa-solid fa-stethoscope"></i> Doctor Room</h3>
<div id="doctor"></div>
<div id="timer"></div>
</div>

<div class="panel">
<h3><i class="fa-solid fa-clock-rotate-left"></i> History</h3>
<div id="history"></div>
</div>

</div>

<footer class="footer">
<i class="fa-solid fa-code"></i> Built by TSK | Smart Hospital Queue System © 2026
</footer>

</div>

<script>

/* LOADER */
window.onload = () => {
setTimeout(()=>{
let loader=document.getElementById("loader");
loader.style.opacity="0";
setTimeout(()=>loader.style.display="none",600);
},3000);
};

let queue=[],history=[],served=0,token=1;
let currentPatient=null;
let time=0;
let timerInterval=null;

function login(){
let u=document.getElementById("user").value;
if(!u)return alert("Enter name");

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("userDisplay").innerText=u;

render();
}

function add(){
let name=document.getElementById("name").value;
let priority=document.getElementById("priority").value;
let dept=document.getElementById("dept").value;

if(!name)return;

let obj={name,token,priority,dept};
token++;

if(priority=="emergency") queue.unshift(obj);
else queue.push(obj);

render();
}

function sendToDoctor(){
if(queue.length==0)return;

currentPatient=queue.shift();

speechSynthesis.speak(
new SpeechSynthesisUtterance("Token "+currentPatient.token)
);

time=0;
clearInterval(timerInterval);

timerInterval=setInterval(()=>{
time++;
document.getElementById("timer").innerText="⏱ "+time+" sec";
},1000);

render();
}

/* ✅ UPDATED FUNCTION */
function completeConsultation(){
if(!currentPatient)return;

let completedData = {
...currentPatient,
duration: time,
date: new Date().toLocaleString()
};

served++;
history.unshift(completedData);

currentPatient=null;
clearInterval(timerInterval);
document.getElementById("timer").innerText="";

render();
}

function render(){

let list=document.getElementById("list");
list.innerHTML="";

let search=document.getElementById("search").value.toLowerCase();

queue.filter(p=>p.name.toLowerCase().includes(search))
.forEach((p,i)=>{
list.innerHTML+=`
<div class="item">
<span>${p.token} | ${p.name} | ${p.dept}</span>
<span>${p.priority}</span>
</div>`;
});

let doc=document.getElementById("doctor");

doc.innerHTML=currentPatient ?
`${currentPatient.token} | ${currentPatient.name}` :
"No patient";

let h=document.getElementById("history");
h.innerHTML="";

/* ✅ UPDATED HISTORY VIEW */
history.forEach((p,i)=>{
h.innerHTML+=`
<div class="item done">
<span>
${p.token} | ${p.name} | ${p.dept}<br>
 Doctor: ${p.dept}<br>
 Duration: ${p.duration || 0} sec<br>
 ${p.date || ""}
</span>
</div>`;
});

document.getElementById("current").innerText=queue.length?queue[0].token:"-";
document.getElementById("waiting").innerText=queue.length;
document.getElementById("served").innerText=served;
document.getElementById("time").innerText=(queue.length*2)+" min";
}

</script>

</body>
</html>
